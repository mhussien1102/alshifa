name: alshifa
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # DI / Routing / Network
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.1.1
  dio: ^5.11.1

  # Error handling / Models
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.2
  lucide_icons_flutter: ^4.0.1
  intl: ^0.20.3
  pinput: ^7.0.0
  skeletonizer: ^3.0.0
  cached_network_image: ^4.0.5

  # Storage / Files / Utils
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  package_info_plus: ^10.2.2
  logger: ^2.8.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  injectable_generator: ^3.1.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700